        // Engine Routing Logics
        function goTo(destination) {
            if (destination === "QuestionHandler") {
                let currentTarget = "L" + level + "_Q" + node;
                if (glitched) { 
                    currentTarget += "_Backup"; 
                }
                renderPassage(currentTarget);
                return;
            }

            if (destination === "RightAnswer") {
                glitched = false;
                node += 1;
                
                if (node > 5) {
                    node = 1;
                    level += 1;
                    
                    if (level === 2) {
                        renderIntermediate("🎉 GREAT JOB!", "Level 1 completely cleared. The engine grid is humming back to life!");
                    } else if (level === 3) {
                        renderIntermediate("🚀 FABULOUS!", "Level 2 bypassed. Cargo lifters are balanced and system pressure is steady!");
                    } else {
                        renderPassage("Victory");
                    }
                } else {
                    goTo("QuestionHandler");
                }
                return;
            }

            if (destination === "WrongAnswer") {
                if (!glitched) {
                    glitched = true;
                    renderIntermediate("⚠️ CRITICAL WARNING: INCORRECT TELEMETRY", "C.O.S.M.O mainframe has detected anomalies... System glitching...<br><br><strong>[X-FACTOR PROTOCOL BYPASS ACTIVATED]:</strong> Rerouting to an equal-difficulty sub-terminal to maintain console stability.", "INITIALIZE BACKUP BYPASS");
                } else {
                    node = 1;
                    glitched = false;
                    renderIntermediate("💥 SYSTEM LOCKDOWN", "Incorrect backup authorization sequence provided. C.O.S.M.O has completely locked down this section's grid nodes.<br><br>Resetting current level node array back to Checkpoint 1...", "RE-INITIALIZE PROTOCOLS");
                }
                return;
            }

            renderPassage(destination);
        }

        // DOM Render Tools
        function renderPassage(passageKey) {
            const data = story[passageKey];
            const container = document.getElementById("game-container");
            
            let statusBar = `<div class='status-bar'>SYSTEM LOG // LEVEL: ${level} | NODE: ${node} | GLITCH MODE: ${glitched ? "ACTIVE" : "OFF"}</div>`;
            if (passageKey === "Start" || passageKey === "Victory") { 
                statusBar = ""; 
            }

            let optionsHtml = "";
            if (data.options && data.options.length > 0) {
                data.options.forEach(opt => {
                    optionsHtml += `<button class="option-btn" onclick="goTo('${opt.next}')">${opt.text}</button>`;
                });
            }

            container.innerHTML = `
                ${statusBar}
                <h2>${data.title}</h2>
                <div class="panel">
                    <p>${data.text}</p>
                </div>
                <div style="margin-top: 20px;">
                    ${optionsHtml}
                </div>
            `;
        }

        function renderIntermediate(headline, content, btnText = "PROCEED") {
            const container = document.getElementById("game-container");
            container.innerHTML = `
                <h2>${headline}</h2>
                <div class="panel">
                    <p>${content}</p>
                </div>
                <div style="margin-top: 20px;">
                    <button class="option-btn" onclick="goTo('QuestionHandler')">${btnText} &rarr;</button>
                </div>
            `;
        }

        // Auto-run on mount
        window.onload = function() {
            renderPassage("Start");
        };
