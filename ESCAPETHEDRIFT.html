<!DOCTYPE html>

            margin: 0 auto;

            color: #58a6ff;

        .panel {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 20px;
            margin-top: 20px;
        }
        .option-btn {
            display: block;
            width: 100%;
            background: #21262d;
            color: #58a6ff;
            border: 1px solid #30363d;
            padding: 12px;
            margin: 10px 0;
            text-align: left;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-family: inherit;
        }
        .option-btn:hover {
            background: #30363d;
            border-color: #8b949e;
        }
        .status-bar {
            font-size: 14px;
            color: #8b949e;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .highlight {
            color: #ffb703;
            font-weight: bold;
        }
    </style>
</head>

        // Game Logic Functions
        function getNextQuestion() {
            // Determine next question based on current progress
            if (state.level === 1 && state.node < 5) {
                state.node++;
                return `L${state.level}_Q${state.node}`;
            } else if (state.level === 1 && state.node === 5) {
                state.level = 2;
                state.node = 1;
                return `L${state.level}_Q${state.node}`;
            } else if (state.level === 2 && state.node < 5) {
                state.node++;
                return `L${state.level}_Q${state.node}`;
            } else if (state.level === 2 && state.node === 5) {
                state.level = 3;
                state.node = 1;
                return `L${state.level}_Q${state.node}`;
            } else if (state.level === 3 && state.node < 5) {
                state.node++;
                return `L${state.level}_Q${state.node}`;
            } else {
                return "GameComplete";
            }
        }

        function useBackupQuestion() {
            return `L${state.level}_Q${state.node}_Backup`;
        }

        function renderPassage(passageName) {
            const passage = story[passageName];
            if (!passage) {
                document.getElementById('game-container').innerHTML = "Error: Passage not found.";
                return;
            }

            let html = `<div class="status-bar">LEVEL ${state.level} | NODE ${state.node}${state.glitched ? ' [GLITCHED]' : ''}</div>`;
            html += `<div class="panel"><h1>${passage.title}</h1><p>${passage.text}</p>`;

            passage.options.forEach(option => {
                html += `<button class="option-btn" onclick="selectOption('${option.next}')">${option.text}</button>`;
            });

            html += '</div>';
            document.getElementById('game-container').innerHTML = html;
        }

        function selectOption(nextPassage) {
            if (nextPassage === "RightAnswer") {
                state.glitched = false;
                state.currentPassage = nextPassage;
                renderPassage("RightAnswer");
            } else if (nextPassage === "WrongAnswer") {
                state.glitched = true;
                state.currentPassage = nextPassage;
                renderPassage("WrongAnswer");
            } else if (nextPassage === "ContinueGame") {
                state.currentPassage = getNextQuestion();
                renderPassage(state.currentPassage);
            } else if (nextPassage === "UseBackup") {
                state.currentPassage = useBackupQuestion();
                renderPassage(state.currentPassage);
            } else {
                state.currentPassage = nextPassage;
                renderPassage(nextPassage);
            }
        }

        function startGame() {
            state.currentPassage = "Start";
            renderPassage("Start");
        }

        // Initialize the game immediately (script runs after #game-container
        // already exists in the DOM, so no need to wait for a load event
        // that may have already fired by this point)
        startGame();
    </script>

</body>
</html>
